<!-- templates/inicio.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tablero de mensajes</title>
</head>
<body>
  <h1>Tablero de mensajes</h1>
  <ul>
    {% for mensaje in mensajes %}
      <li>{{ mensaje.texto }}</li>
    {% empty %}
      <li>Todavía no hay mensajes.</li>
    {% endfor %}
  </ul>
</body>
</html>
